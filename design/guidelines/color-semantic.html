<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px;background:var(--bg-canvas)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line-hairline)}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;font:var(--weight-medium) 11px/1.3 var(--font-mono)}.lbl{font:var(--text-eyebrow);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-caption)}.rowg{display:flex;gap:14px}</style>
<div class="rowg"><div style="flex:1;background:var(--status-success-bg);color:var(--status-success);border:1px solid currentColor;border-radius:var(--radius-md);padding:12px 14px"><div style="font:var(--weight-semibold) 15px var(--font-body)">Sucesso</div><div style="font:11px var(--font-mono);opacity:.8;margin-top:6px">status-success<br>status-success-bg</div></div><div style="flex:1;background:var(--status-warning-bg);color:var(--status-warning);border:1px solid currentColor;border-radius:var(--radius-md);padding:12px 14px"><div style="font:var(--weight-semibold) 15px var(--font-body)">Atenção</div><div style="font:11px var(--font-mono);opacity:.8;margin-top:6px">status-warning<br>status-warning-bg</div></div><div style="flex:1;background:var(--status-danger-bg);color:var(--status-danger);border:1px solid currentColor;border-radius:var(--radius-md);padding:12px 14px"><div style="font:var(--weight-semibold) 15px var(--font-body)">Cuidado</div><div style="font:11px var(--font-mono);opacity:.8;margin-top:6px">status-danger<br>status-danger-bg</div></div><div style="flex:1;background:var(--status-info-bg);color:var(--status-info);border:1px solid currentColor;border-radius:var(--radius-md);padding:12px 14px"><div style="font:var(--weight-semibold) 15px var(--font-body)">Contexto</div><div style="font:11px var(--font-mono);opacity:.8;margin-top:6px">status-info<br>status-info-bg</div></div></div>
