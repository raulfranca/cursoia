<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px;background:var(--bg-canvas)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line-hairline)}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;font:var(--weight-medium) 11px/1.3 var(--font-mono)}.lbl{font:var(--text-eyebrow);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-caption)}.rowg{display:flex;gap:14px}</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 28px;font:13px/2 var(--font-mono);color:var(--ink-3)">
<div><span style="color:var(--text-body)">■</span> --text-body</div><div><span style="color:var(--surface-card);background:var(--ink-2)">■</span> --surface-card</div>
<div><span style="color:var(--text-muted)">■</span> --text-muted</div><div><span style="color:var(--bg-band)">■</span> --bg-band</div>
<div><span style="color:var(--text-caption)">■</span> --text-caption</div><div><span style="color:var(--bg-brand)">■</span> --bg-brand</div>
<div><span style="color:var(--text-disabled)">■</span> --text-disabled</div><div><span style="color:var(--bg-brand-soft)">■</span> --bg-brand-soft</div>
<div><span style="color:var(--text-link)">■</span> --text-link</div><div><span style="color:var(--line-hairline)">■</span> --line-hairline</div>
<div><span style="color:var(--text-link-hover)">■</span> --text-link-hover</div><div><span style="color:var(--line-strong)">■</span> --line-strong</div></div>
