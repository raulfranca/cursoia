<!-- @dsCard group="Spacing" viewport="700x150" name="Raios e bordas" subtitle="Cantos suaves; bordas de 1px, 1.5px e 2px" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px;background:var(--bg-canvas)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line-hairline)}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;font:var(--weight-medium) 11px/1.3 var(--font-mono)}.lbl{font:var(--text-eyebrow);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-caption)}.rowg{display:flex;gap:14px}</style>
<div class="rowg"><div style="flex:1;text-align:center"><div style="height:56px;background:var(--paper-2);border:1.5px solid var(--line-strong);border-radius:4px"></div><div style="font:10px var(--font-mono);color:var(--text-caption);margin-top:6px">sm<br>4px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--paper-2);border:1.5px solid var(--line-strong);border-radius:8px"></div><div style="font:10px var(--font-mono);color:var(--text-caption);margin-top:6px">md<br>8px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--paper-2);border:1.5px solid var(--line-strong);border-radius:14px"></div><div style="font:10px var(--font-mono);color:var(--text-caption);margin-top:6px">lg<br>14px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--paper-2);border:1.5px solid var(--line-strong);border-radius:22px"></div><div style="font:10px var(--font-mono);color:var(--text-caption);margin-top:6px">xl<br>22px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--paper-2);border:1.5px solid var(--line-strong);border-radius:999px"></div><div style="font:10px var(--font-mono);color:var(--text-caption);margin-top:6px">pill<br>999px</div></div>
<div style="flex:1.4;display:flex;flex-direction:column;gap:6px;justify-content:center"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;border-top:1px solid var(--line-hairline)"></div><span style="font:10px var(--font-mono);color:var(--text-caption)">1px hairline</span></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;border-top:1.5px solid var(--line-strong)"></div><span style="font:10px var(--font-mono);color:var(--text-caption)">1.5px ink</span></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;border-top:2px solid var(--line-strong)"></div><span style="font:10px var(--font-mono);color:var(--text-caption)">2px heavy</span></div></div></div>
