<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px;background:var(--bg-canvas)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line-hairline)}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;font:var(--weight-medium) 11px/1.3 var(--font-mono)}.lbl{font:var(--text-eyebrow);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-caption)}.rowg{display:flex;gap:14px}</style>
<style>@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(180px)}}</style>
<div style="display:flex;flex-direction:column;gap:10px;font:11px var(--font-mono);color:var(--text-caption)">
<div style="display:flex;align-items:center;gap:12px"><div style="width:230px;height:16px;background:var(--paper-2);border:1px dashed var(--line-hairline);position:relative"><div style="width:34px;height:14px;background:var(--lousa-500);animation:slide 1.4s cubic-bezier(.22,.61,.36,1) infinite"></div></div>fast 140ms</div><div style="display:flex;align-items:center;gap:12px"><div style="width:230px;height:16px;background:var(--paper-2);border:1px dashed var(--line-hairline);position:relative"><div style="width:34px;height:14px;background:var(--lousa-500);animation:slide 2.2s cubic-bezier(.22,.61,.36,1) infinite"></div></div>base 220ms</div><div style="display:flex;align-items:center;gap:12px"><div style="width:230px;height:16px;background:var(--paper-2);border:1px dashed var(--line-hairline);position:relative"><div style="width:34px;height:14px;background:var(--lousa-500);animation:slide 3.8s cubic-bezier(.22,.61,.36,1) infinite"></div></div>slow 380ms</div>
<div>ease-out cubic-bezier(.22,.61,.36,1) · sem bounce, sem spring</div></div>
