<!-- @dsCard group="Slides" viewport="1280x720" name="Conteúdo com ilustração" subtitle="Lista de aprendizados + arte de apoio" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;background:var(--paper-1)}
.slide{width:1280px;height:720px;position:relative;display:flex;flex-direction:column;padding:64px 80px;box-sizing:border-box}
.eyebrow{font:var(--weight-semibold) 18px/1.2 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--terracota-500)}
.mark{position:absolute;right:80px;bottom:52px;font:var(--weight-semibold) 20px/1.05 var(--font-display);letter-spacing:-.03em;color:var(--ink-3);text-align:right}
.pg{position:absolute;left:80px;bottom:52px;font:15px var(--font-mono);color:var(--ink-4)}
.floor{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--ink-1)}
h1{font-size:82px;line-height:1.02;letter-spacing:-.03em}h2{font-size:54px;line-height:1.08;letter-spacing:-.028em}
p{font:400 27px/1.5 var(--font-body);color:var(--ink-2)}</style>
<div class="slide">
  <span class="eyebrow">O que você leva hoje</span>
  <h2 style="max-width:26ch;margin-top:18px">Três coisas prontas ao fim da aula</h2>
  <div style="display:grid;grid-template-columns:1.05fr .95fr;gap:56px;margin-top:40px;align-items:start">
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:24px">
      <li style="display:flex;gap:20px;align-items:flex-start"><span style="flex:none;width:52px;height:52px;border:1.5px solid var(--ink-1);border-radius:999px;display:grid;place-items:center;font:500 18px var(--font-mono)">01</span><span><span style="display:block;font:var(--weight-semibold) 29px/1.2 var(--font-display);letter-spacing:-.02em">Um plano de aula em 15 minutos</span><span style="display:block;font:400 22px/1.4 var(--font-body);color:var(--ink-3);margin-top:6px">do objetivo à atividade de fechamento</span></span></li><li style="display:flex;gap:20px;align-items:flex-start"><span style="flex:none;width:52px;height:52px;border:1.5px solid var(--ink-1);border-radius:999px;display:grid;place-items:center;font:500 18px var(--font-mono)">02</span><span><span style="display:block;font:var(--weight-semibold) 29px/1.2 var(--font-display);letter-spacing:-.02em">Uma atividade em três níveis</span><span style="display:block;font:400 22px/1.4 var(--font-body);color:var(--ink-3);margin-top:6px">sem reescrever o enunciado do zero</span></span></li><li style="display:flex;gap:20px;align-items:flex-start"><span style="flex:none;width:52px;height:52px;border:1.5px solid var(--ink-1);border-radius:999px;display:grid;place-items:center;font:500 18px var(--font-mono)">03</span><span><span style="display:block;font:var(--weight-semibold) 29px/1.2 var(--font-display);letter-spacing:-.02em">Uma rubrica de quatro níveis</span><span style="display:block;font:400 22px/1.4 var(--font-body);color:var(--ink-3);margin-top:6px">com o critério ainda na sua mão</span></span></li>
    </ul>
    <img src="../assets/illustrations/professora-tem-ideias.png" alt="" style="width:100%;border:1px solid var(--line-hairline);border-radius:var(--radius-lg)">
  </div>
  <div class="pg">03</div><div class="mark">IA para<br>Professores</div>
</div>
