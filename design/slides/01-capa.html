<!-- @dsCard group="Slides" viewport="1280x720" name="Capa" subtitle="Título grande, ilustração à direita, régua no piso" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;background:var(--paper-1)}
.slide{width:1280px;height:720px;position:relative;display:flex;flex-direction:column;padding:64px 80px;box-sizing:border-box}
.eyebrow{font:var(--weight-semibold) 18px/1.2 var(--font-mono);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--terracota-500)}
.mark{position:absolute;right:80px;bottom:52px;font:var(--weight-semibold) 20px/1.05 var(--font-display);letter-spacing:-.03em;color:var(--ink-3);text-align:right}
.pg{position:absolute;left:80px;bottom:52px;font:15px var(--font-mono);color:var(--ink-4)}
.floor{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--ink-1)}
h1{font-size:82px;line-height:1.02;letter-spacing:-.03em}h2{font-size:54px;line-height:1.08;letter-spacing:-.028em}
p{font:400 27px/1.5 var(--font-body);color:var(--ink-2)}</style>
<div class="slide" style="padding-right:0">
<div style="display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;height:100%">
  <div style="display:flex;flex-direction:column;gap:26px;padding-bottom:40px">
    <span class="eyebrow">Formação de 4 semanas</span>
    <h1>IA que cabe na sua aula de segunda-feira</h1>
    <p style="max-width:22ch">Encontro 1 · A IA como colega de planejamento</p>
    <div style="display:flex;align-items:center;gap:20px;padding-top:8px">
      <span style="font:400 22px var(--font-body);color:var(--ink-3)">9 de março · 19h30</span>
      <span style="font:var(--text-note);color:var(--terracota-500);display:inline-block;transform:rotate(-1.2deg);font-size:30px">traga uma atividade sua</span>
    </div>
  </div>
  <img src="../assets/illustrations/professora-no-laptop.png" alt="" style="width:100%">
</div>
<div class="floor"></div><div class="mark">IA para<br>Professores</div>
</div>
