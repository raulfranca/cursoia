<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px;background:var(--bg-canvas)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.grid{display:grid;gap:16px}</style>
<div id="root"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.IAParaProfessoresDesignSystem_518ecc;
function Demo(){const[ok,setOk]=React.useState(true);const[on,setOn]=React.useState(true);const[v,setV]=React.useState('fund1');return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
<div className="col"><Input label="Seu e-mail" required placeholder="voce@escola.br" hint="Usamos só para enviar as aulas."/><Input label="Escola" placeholder="Nome da escola" disabled defaultValue="Desabilitado"/><Input label="Telefone" defaultValue="11 9" error="Número incompleto."/></div>
<div className="col"><Select label="Etapa em que você atua" placeholder="Escolha uma opção" options={['Educação Infantil','Fundamental I','Fundamental II','Ensino Médio']}/><Input label="O que você quer resolver?" multiline placeholder="Ex.: adaptar atividades para três níveis"/></div>
<div className="col" style={{gridColumn:'1 / -1',gap:12}}>
<div className="row" style={{gap:28}}><Checkbox checked={ok} onChange={setOk}>Quero receber as aulas</Checkbox><Checkbox>Não marcado</Checkbox><Checkbox disabled>Desabilitado</Checkbox></div>
<div className="row" style={{gap:28}}><Radio name="e" value="fund1" checked={v==='fund1'} onChange={setV}>Fundamental I</Radio><Radio name="e" value="fund2" checked={v==='fund2'} onChange={setV}>Fundamental II</Radio><Switch checked={on} onChange={setOn}>Receber lembretes</Switch></div>
</div></div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
